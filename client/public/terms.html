<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>服务条款</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --brand: #009688;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171717;
          --fg: #e5e7eb;
          --muted: #9ca3af;
          --border: #3f3f46;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        line-height: 1.75;
      }
      .page {
        max-width: 820px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 8px;
      }
      h1 {
        font-size: 24px;
        margin: 0;
      }
      .back {
        flex: none;
        color: var(--brand);
        text-decoration: none;
        font-size: 14px;
      }
      .back:hover {
        text-decoration: underline;
      }
      .updated {
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 16px;
      }
      article {
        white-space: pre-line;
        word-break: break-word;
        border-top: 1px solid var(--border);
        padding-top: 24px;
        font-size: 15px;
      }
      article h2 {
        font-size: 18px;
        margin: 28px 0 8px;
      }
      article p,
      article ul,
      article ol {
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="top">
        <h1>服务条款</h1>
        <a class="back" href="/">返回</a>
      </div>
      <p class="updated">生效日期：2026 年</p>

      <!--
        只需要在下面的 <article> 里填写正文。
        · 直接写纯文本即可，换行会自动保留；
        · 想排版更好看可以写 HTML（例如 <h2>标题</h2>、<ul><li>…</li></ul>）。
      -->
      <article>
在此填写「服务条款」正文。
      </article>
    </div>
  </body>
</html>
