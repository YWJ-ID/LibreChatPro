  # 临时聊天保留期限（小时）（默认：720，最小：1，最大：8760）
  # temporaryChatRetention: 1
  # 保留模式："all" 对所有数据类型应用过期，"temporary"（默认）仅对临时聊天
  # 从 "all" 切换回 "temporary" 之前，从不应过期的非临时数据中删除保留截止时间：
  # db.conversations.updateMany({ isTemporary: false, expiredAt: { $ne: null } }, { $unset: { expiredAt: 1 } })
  # db.messages.updateMany({ isTemporary: false, expiredAt: { $ne: null } }, { $unset: { expiredAt: 1 } })
  # MongoDB 不会自动删除被取代的索引。升级后，旧的 Meili 索引
  # 如 "_meiliIndex_1_expiredAt_1" 可以在新的
  # "_meiliIndex_1_isTemporary_1_expiredAt_1" 索引存在后从 conversations/messages 中删除
  # retentionMode: "temporary"

