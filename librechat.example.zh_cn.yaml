  #   recursionLimit: 50
  #   # （可选）智能体的最大递归深度，默认为 25
  #   maxRecursionLimit: 100
  #   # （可选）禁用智能体的构建器界面
  #   disableBuilder: false
  #   # （可选）智能体响应中包含的最大总引用数，默认为 30
  #   maxCitations: 30
  #   # （可选）智能体响应中每个文件包含的最大引用数，默认为 7
  #   maxCitationsPerFile: 7
  #   # （可选）包含在响应中的源的最小相关性分数，默认为 0.45（45% 相关性阈值）
  #   # 设置为 0.0 显示所有源（不过滤），或设置为更高如 0.7 进行更严格的过滤
  #   minRelevanceScore: 0.45
  #   # （可选）所有用户可用的智能体能力。省略你想排除的能力。默认为以下列表。
  #   capabilities: ["deferred_tools", "execute_code", "file_search", "actions", "tools"]

  # 带 Vertex AI 支持的 Anthropic 端点配置
  # 使用此配置通过 Google Cloud Vertex AI 运行 Anthropic Claude 模型
  # anthropic:
  #   # （可选）流速率限制（毫秒）
  #   streamRate: 20
  #   # （可选）对话标题的标题模型
  #   titleModel: claude-3.5-haiku  # 使用可见模型名称（来自 models 配置的键）
  #
  #   # Vertex AI 配置 - 启用通过 Google Cloud 运行 Claude 模型
  #   # 这类似于 Azure OpenAI，但适用于 Google Cloud 上的 Anthropic 模型
  #   # 当存在此配置部分时，Vertex AI 自动启用
  #   vertex:
  #     # Vertex AI 区域（可选，默认为 'us-east5'）
  #     # 可用区域：us-east5、us-central1、europe-west1、europe-west4、asia-southeast1
  #     # 多区域端点：us、eu、global
  #     region: "us-east5"
  #     # Google 服务账户密钥文件路径（可选）
  #     # 如果未指定，使用 GOOGLE_SERVICE_KEY_FILE 环境变量或默认路径（api/data/auth.json）
  #     # project_id 自动从服务密钥文件中提取
  #     # serviceKeyFile: "/path/to/service-account.json"
  #     # Google Cloud 项目 ID（可选）- 从服务密钥文件自动检测
  #     # 仅在你需要覆盖服务密钥中的 project_id 时指定
  #     # projectId: "${VERTEX_PROJECT_ID}"
  #
  #     # ============================================================================
  #     # 模型配置 - 设置可见模型名称和部署映射
  #     # 类似于 Azure OpenAI 模型命名模式
  #     # ============================================================================
  #
  #     # 选项 1：简单数组（旧格式 - 模型名称 = 部署名称）
  #     # 如果你想在 UI 中显示技术模型 ID，请使用此选项
  #     # models:
  #     #   - "claude-sonnet-4-6"
  #     #   - "claude-3-7-sonnet-20250219"
  #     #   - "claude-3-5-sonnet-v2@20241022"
  #     #   - "claude-3-5-haiku@20241022"
  #
  #     # 选项 2：带有自定义可见名称的对象格式（推荐）
  #     # 键是 UI 中显示的可见模型名称（可以是任何你想要的名称）
  #     # deploymentName 是 API 调用使用的实际 Vertex AI 模型 ID
  #     # 你可以使用友好名称（避免空格以获得更清晰的 YAML）或技术 ID 作为键
  #     models:
  #       claude-opus-4.5:
  #         deploymentName: claude-opus-4-5@20251101
  #       claude-sonnet-4:
  #         deploymentName: claude-sonnet-4-6
  #       claude-3.7-sonnet:
  #         deploymentName: claude-3-7-sonnet-20250219
  #       claude-3.5-sonnet:
  #         deploymentName: claude-3-5-sonnet-v2@20241022
  #       claude-3.5-haiku:
  #         deploymentName: claude-3-5-haiku@20241022
  #
  #     # 选项 3：混合格式与默认 deploymentName
  #     # 设置默认 deploymentName 并对模型使用布尔值
  #     # deploymentName: claude-sonnet-4-6
  #     # models:
  #     #   claude-sonnet-4: true  # 将使用默认 deploymentName
  #     #   claude-3.5-haiku:
  #     #     deploymentName: claude-3-5-haiku@20241022  # 覆盖此模型

  custom:
    # Groq 示例
    - name: 'groq'
      apiKey: '${GROQ_API_KEY}'
      baseURL: 'https://api.groq.com/openai/v1/'
      models:
        default:
          - 'llama3-70b-8192'
          - 'llama3-8b-8192'
          - 'llama2-70b-4096'
          - 'mixtral-8x7b-32768'
          - 'gemma-7b-it'
        fetch: false
      titleConvo: true
      titleModel: 'mixtral-8x7b-32768'
      modelDisplayLabel: 'groq'

    # Mistral AI 示例
    - name: 'Mistral' # 端点的唯一名称
      # 对于 `apiKey` 和 `baseURL`，你可以使用你定义的环境变量。
      # 推荐的环境变量：
      apiKey: '${MISTRAL_API_KEY}'
      baseURL: 'https://api.mistral.ai/v1'

      # 模型配置
      models:
        # 默认使用的模型列表。至少需要一个值。
        default: ['mistral-tiny', 'mistral-small', 'mistral-medium']
        # Fetch 选项：设置为 true 从 API 获取模型。
        fetch: true # 默认为 false。

      # 可选配置

      # 标题对话设置
      titleConvo: true # 设置为 true 启用标题对话

      # 标题方法：在 "completion" 或 "functions" 之间选择。
      # titleMethod: "completion"  # 如果省略，默认为 "completion"。

      # 标题模型：指定用于标题的模型。
      titleModel: 'mistral-tiny' # 如果省略，默认为 "gpt-3.5-turbo"。

      # 摘要设置：设置为 true 启用摘要。
      # summarize: false

      # 摘要模型：如果启用摘要，指定使用的模型。
      # summaryModel: "mistral-tiny"  # 如果省略，默认为 "gpt-3.5-turbo"。

      # 消息中显示的 AI 模型标签。
      modelDisplayLabel: 'Mistral' # 未设置时默认为 "AI"。

      # 向请求添加额外参数。默认参数将被覆盖。
      # addParams:
      # safe_prompt: true # 此字段特定于 Mistral AI：https://docs.mistral.ai/api/

      # 从请求中删除默认参数。参见下面链接的指南中的默认参数。
      # 注意：对于 Mistral，必须删除以下参数，否则会遇到 422 错误：
      dropParams: ['stop', 'user', 'frequency_penalty', 'presence_penalty']

    # OpenRouter 示例
    - name: 'OpenRouter'
      # 对于 `apiKey` 和 `baseURL`，你可以使用你定义的环境变量。
      # 推荐的环境变量：
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      headers:
        x-librechat-body-parentmessageid: '{{LIBRECHAT_BODY_PARENTMESSAGEID}}'
      models:
        default: ['meta-llama/llama-3-70b-instruct']
        fetch: true
      titleConvo: true
      titleModel: 'meta-llama/llama-3-70b-instruct'
      # 推荐：从请求中删除 stop 参数，因为 Openrouter 模型使用多种停止令牌。
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'

    # Helicone 示例
    - name: 'Helicone'
      # 对于 `apiKey` 和 `baseURL`，你可以使用你定义的环境变量。
      # 推荐的环境变量：
      apiKey: '${HELICONE_KEY}'
      baseURL: 'https://ai-gateway.helicone.ai'
      headers:
        x-librechat-body-parentmessageid: '{{LIBRECHAT_BODY_PARENTMESSAGEID}}'
      models:
        default:
          ['gpt-4o-mini', 'claude-4.5-sonnet', 'llama-3.1-8b-instruct', 'gemini-2.5-flash-lite']
        fetch: true
      titleConvo: true
      titleModel: 'gpt-4o-mini'
      modelDisplayLabel: 'Helicone'
      iconURL: https://marketing-assets-helicone.s3.us-west-2.amazonaws.com/helicone.png

    # Portkey AI 示例
    - name: 'Portkey'
      apiKey: 'dummy'
      baseURL: 'https://api.portkey.ai/v1'
      headers:
        x-portkey-api-key: '${PORTKEY_API_KEY}'
        x-portkey-virtual-key: '${PORTKEY_OPENAI_VIRTUAL_KEY}'
      models:
        default: ['gpt-4o-mini', 'gpt-4o', 'chatgpt-4o-latest']
        fetch: true
      titleConvo: true
      titleModel: 'current_model'
      summarize: false
      summaryModel: 'current_model'
      modelDisplayLabel: 'Portkey'
      iconURL: https://images.crunchbase.com/image/upload/c_pad,f_auto,q_auto:eco,dpr_1/rjqy7ghvjoiu4cd1xjbf

  # AWS Bedrock 示例
  # 注意：Bedrock 端点通过环境变量配置
  # bedrock:
  #   # 模型配置
  #   # 指定可用的模型（等同于 BEDROCK_AWS_MODELS 环境变量）
  #   models:
  #     - "anthropic.claude-3-7-sonnet-20250219-v1:0"
  #     - "anthropic.claude-3-5-sonnet-20241022-v2:0"
  #
  #   # 推理配置文件配置
  #   # 将模型 ID 映射到其推理配置文件 ARN
  #   # 重要：模型 ID（键）必须是有效的 AWS Bedrock 模型 ID，你已添加到上面的模型列表中
  #   # ARN（值）是你希望为此模型映射到的推理配置文件
  #   # 模型 ID 和 ARN 都发送到 AWS - 模型 ID 用于验证/元数据，ARN 用于路由
  #   inferenceProfiles:
  #     "us.anthropic.claude-sonnet-4-6": "${BEDROCK_INFERENCE_PROFILE_CLAUDE_SONNET}"
  #     "anthropic.claude-3-7-sonnet-20250219-v1:0": "arn:aws:bedrock:us-west-2:123456789012:application-inference-profile/abc123"
  #
  #   # Guardrail 配置
  #   guardrailConfig:
  #     guardrailIdentifier: "your-guardrail-id"
  #     guardrailVersion: "1"
  #
  #     # 调试的跟踪行为（可选）
  #     # - "enabled"：包含有关 guardrail 评估的基本跟踪信息
  #     # - "enabled_full"：包含全面的跟踪详情（推荐用于调试）
  #     # - "disabled"：无跟踪信息（默认）
  #     # 跟踪输出记录到应用程序日志文件以进行合规审计
  #     trace: "enabled"
