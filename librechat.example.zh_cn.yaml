# 网页搜索配置（可选）
# webSearch:
#   # Jina 重新排序配置
#   jinaApiKey: '${JINA_API_KEY}'  # 你的 Jina API 密钥
#   jinaApiUrl: '${JINA_API_URL}'  # 自定义 Jina API URL（可选，默认为 https://api.jina.ai/v1/rerank）
#   # 其他重新排序器
#   cohereApiKey: '${COHERE_API_KEY}'
#   # 搜索提供商
#   serperApiKey: '${SERPER_API_KEY}'
#   searxngInstanceUrl: '${SEARXNG_INSTANCE_URL}'
#   searxngApiKey: '${SEARXNG_API_KEY}'
#   # Tavily（搜索提供商和/或抓取器）
#   tavilyApiKey: '${TAVILY_API_KEY}'
#   # 内容抓取器
#   firecrawlApiKey: '${FIRECRAWL_API_KEY}'
#   firecrawlApiUrl: '${FIRECRAWL_API_URL}'
#
# Tavily 作为搜索和抓取提供商示例：
# webSearch:
#   searchProvider: tavily
#   scraperProvider: tavily
#   tavilyApiKey: '${TAVILY_API_KEY}'
#   # 可选：自定义 API URL（默认为 https://api.tavily.com/search 和 https://api.tavily.com/extract）
#   # tavilySearchUrl: '${TAVILY_SEARCH_URL}'
#   # tavilyExtractUrl: '${TAVILY_EXTRACT_URL}'
#   tavilySearchOptions:
#     searchDepth: basic        # 'basic'、'advanced'、'fast' 或 'ultra-fast'（默认：basic）
#     maxResults: 5             # 每次搜索 1-20 个结果（默认：5）
#     topic: general            # 'general'、'news' 或 'finance'
#     # includeAnswer: basic    # 包含答案摘要：true、'basic' 或 'advanced'
#     # includeRawContent: markdown # 包含原始内容：true、'markdown' 或 'text'
#     # includeImages: true     # 在结果中包含图像
#     # includeFavicon: true    # 为每个结果包含 favicon URL
#     # chunksPerSource: 3      # 每个源的块数，仅 'advanced' 深度时可用（1-3）
#     # safeSearch: false       # 覆盖 Tavily safe_search 过滤（true 仅限企业）
#     # includeDomains:         # 限制搜索到特定域（最多 300 个）
#     #   - 'example.com'
#     #   - 'docs.example.com'
#     # excludeDomains:         # 从结果中排除特定域（最多 150 个）
#     #   - 'spam.com'
#     # timeRange: week         # 'day'、'week'、'month' 或 'year'
#     # timeout: 15000          # HTTP 请求超时（毫秒）（最大 120000）
#   tavilyScraperOptions:
#     extractDepth: basic       # 'basic'（1 积分/5 个 URL）或 'advanced'（2 积分/5 个 URL，更彻底）
#     # includeImages: false    # 包含从 URL 提取的图像
#     # includeFavicon: false   # 为每个结果包含 favicon URL
#     # format: markdown        # 'markdown'（默认）或 'text'（纯文本，可能增加延迟）
#     # timeout: 15000          # HTTP 请求超时（毫秒）（最大 120000）；Tavily Extract 接收秒数，限制在 1-60

