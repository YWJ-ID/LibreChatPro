# 智能体操作域限制（OpenAPI 规范验证）
# 安全：如果未配置，SSRF 目标将被阻止（localhost、私有 IP、.internal/.local TLD）。
# 优先使用 `allowedAddresses` 允许内部目标 — 向
# `allowedDomains` 添加私有 IP 会将该字段切换到严格白名单模式，并阻止未列出的所有
# 公共目标。
# 支持通配符：'*.example.com' 和协议/端口限制：'https://api.example.com:8443'
actions:
  allowedDomains:
    - 'swapi.dev'
    - 'librechat.ai'
    - 'google.com'
    # - 'http://10.225.26.25:7894'  # 带协议/端口的内部 IP（如需要请取消注释）
  # `allowedAddresses` 是 SSRF 豁免列表，不是严格的白名单。
  # 此处列出的主机名/IP + 端口对绕过该
  # 私有/环回/链路本地服务的默认拒绝块。公共域继续正常工作
  # — 在此处列出私有目标不会限制对其他任何内容的访问。
  #
  # 条目必须包含端口：`host:port`、`private.ip:port` 或 `[ipv6]:port`。
  # 不要使用 URL、路径、CIDR 范围、裸主机/IP 或公共 IP 字面量。
  # 公共 IP 字面量在配置加载时被拒绝（该字段限定为
  # 私有 IP 空间；公共 IP 不是 SSRF 目标）。
  #
  # 关于主机名的注意：主机名条目信任该名称解析到的任何 IP
  # 在列出的端口上。如果该名称的 DNS 被劫持或轮换到不同的
  # 私有 IP，豁免将跟随。仅列出你控制 DNS 的主机名。
  # 尽可能优先使用字面 IP。
  # allowedAddresses:
  #   - 'host.docker.internal:11434'
  #   - '127.0.0.1:11434'
  #   - '10.0.0.5:8080'

# 自定义端点 baseURL 豁免列表
# 安全：用户提供的 baseURL（`baseURL: 'user_provided'`）将根据
# 与操作和 MCP 相同的 SSRF 块进行验证。如果你的用户合法指向私有
# 服务（自托管 Ollama、内部 LLM 网关等），在此处列出这些主机名/IP
# + 端口对，以便验证器允许它们通过。公共目标不受影响。
#
# 条目必须包含端口：`host:port`、`private.ip:port` 或 `[ipv6]:port`。
# 不要使用 URL、路径、CIDR 范围、裸主机/IP 或公共 IP 字面量。
# 主机名条目信任它们解析到的任何 IP 在列出的端口上 — 仅
# 列出你控制 DNS 的名称。
# endpoints:
#   allowedAddresses:
#     - 'localhost:11434'
#     - '127.0.0.1:11434'
#     - 'ollama:11434'
#     - '10.0.0.5:8080'

# MCP 服务器远程传输域限制（SSE、WebSocket、HTTP）
# 安全：如果未配置，SSRF 目标将被阻止（localhost、私有 IP、.internal/.local TLD）。
# 优先使用 `allowedAddresses` 允许内部目标 — 向
# `allowedDomains` 添加私有主机将该字段切换到严格白名单模式，并阻止未列出的所有
# 公共目标。
# 支持通配符：'*.example.com' 匹配 'api.example.com'、'staging.example.com' 等。
# 支持协议/端口限制：'https://api.example.com:8443' 限制为特定协议/端口。
# mcpSettings:
#   allowedDomains:
#     - 'host.docker.internal'    # Docker 主机访问（Docker 设置必需）
#     - 'localhost'               # 本地开发
#     - '*.example.com'           # 通配符子域
#     - 'https://secure.api.com'  # 协议限制
#     - 'http://internal:8080'    # 协议和端口限制
#   # allowedAddresses 是 SSRF 豁免列表（仅限私有 IP 空间）。
#   # 此处列出的主机名/IP + 端口对绕过该
#   # 私有服务的默认拒绝块；公共目标保持可访问。当你
#   # 需要默认 SSRF 保护和特定内部 MCP 服务器时很有用。条目必须
#   # 包含端口（`host:port`、`private.ip:port` 或 `[ipv6]:port`），并且必须
#   # 不是 URL、路径、CIDR 范围、裸主机/IP 或公共 IP 字面量。
#   # 主机名条目信任它们解析到的任何 IP 在列出的端口上。
#   allowedAddresses:
#     - 'host.docker.internal:8080'
#     - '127.0.0.1:8080'

