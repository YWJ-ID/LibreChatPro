  #   # privateAssistants: false # 不适用于 `supportedIds` 或 `excludedIds`
  #   # （可选）支持检索的模型，将默认为最新已知支持该功能的 OpenAI 模型
  #   retrievalModels: ["gpt-4-turbo-preview"]
  #   # （可选）所有用户可用的智能体能力。省略你想排除的能力。默认为以下列表。
  #   capabilities: ["code_interpreter", "retrieval", "actions", "tools", "image_vision"]
  # agents:
